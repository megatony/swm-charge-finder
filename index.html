<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>SWM Şarj Bul</title>
<style>
  :root { --bg:#0b0d10; --card:#161a20; --fg:#f2f4f7; --mut:#9aa3af; --ok:#22c55e; --warn:#f59e0b; --acc:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:20px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  h1 { font-size:34px; margin:0 0 6px; }
  .sub { color:var(--mut); font-size:18px; margin-bottom:18px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  button, .btn { appearance:none; border:0; border-radius:16px; padding:22px 28px; font-size:24px; font-weight:700; color:#fff; background:var(--acc); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; min-height:76px; }
  button.sec { background:#2a313b; }
  .big { width:100%; font-size:30px; min-height:96px; }
  input { flex:1; min-width:260px; font-size:24px; padding:20px; border-radius:16px; border:2px solid #2a313b; background:#0f1318; color:var(--fg); }
  #status { margin:16px 0; color:var(--mut); min-height:28px; }
  .banner { background:#2b2410; color:#fcd34d; border-radius:14px; padding:14px 18px; font-size:17px; margin:12px 0; display:none; }
  .card { background:var(--card); border-radius:20px; padding:22px; margin:14px 0; display:flex; gap:18px; align-items:center; }
  .card .info { flex:1; }
  .card .addr { font-size:26px; font-weight:700; }
  .card .meta { color:var(--mut); font-size:19px; margin-top:6px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; font-size:17px; font-weight:700; margin-right:8px; }
  .b-ok { background:#0f2e1b; color:var(--ok); } .b-unk { background:#2b2410; color:var(--warn); }
  .go { background:var(--ok); min-width:170px; font-size:30px; }
  #manual { display:none; margin-top:14px; }
  footer { color:var(--mut); font-size:14px; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>⚡ SWM Şarj Bul</h1>
  <div class="sub">En yakın SWM şarj noktası · tek dokunuşla yol tarifi</div>
  <button id="find" class="big">📍 En yakını bul</button>
  <div class="row" style="margin-top:14px">
    <button class="sec" id="toggleManual">✍️ Konumu elle gir</button>
    <button class="sec" id="fast">🚀 Sadece hızlı (≥50 kW)</button>
  </div>
  <div id="manual" class="row">
    <input id="q" placeholder="Adres ya da 48.137,11.575">
    <button id="go">Ara</button>
  </div>
  <div id="banner" class="banner"></div>
  <div id="status"></div>
  <div id="list"></div>
  <footer>Veri: Bundesnetzagentur Ladesäulenregister. Mesafe kuş uçuşu. Adres arama: OpenStreetMap Nominatim.</footer>
</main>
<script type="module">
import { rank } from './core.js';
const $ = (id) => document.getElementById(id);
let minKw = 0, stationsCache = null, last = null;

async function getNearest(lat, lng) {
  try { // backend (live status if configured)
    const r = await fetch(`/api/nearest?lat=${lat}&lng=${lng}&limit=3&minKw=${minKw}`);
    if (r.ok) return await r.json();
  } catch {}
  // static hosting fallback: compute in the browser
  stationsCache ||= (await (await fetch('./stations.json')).json()).stations;
  return { live: false, results: rank(stationsCache, { lat, lng }, { limit: 3, minKw }) };
}

function render(data) {
  const b = $('banner');
  if (!data.live) { b.style.display = 'block'; b.textContent = '⚠️ Canlı doluluk verisi bağlı değil: en yakın SWM noktaları gösteriliyor, boş olup olmadığı bilinmiyor.'; }
  else b.style.display = 'none';
  if (!data.results.length) { $('list').innerHTML = '<div class="card">Yakında boş SWM noktası bulunamadı.</div>'; return; }
  $('list').innerHTML = data.results.map((s) => {
    const plugs = [...new Set(s.points.map((p) => `${p.plug.replace(' Steckdose','').replace(' Fahrzeugkupplung','')} ${p.kw ?? '?'} kW`))].join(' · ');
    const badge = s.live ? `<span class="badge b-ok">${s.freeCount}/${s.points.length} boş</span>` : `<span class="badge b-unk">durum bilinmiyor</span>`;
    return `<div class="card"><div class="info"><div class="addr">${s.address}</div>
      <div class="meta">${badge}${s.distanceKm.toFixed(1)} km · ${s.city}</div><div class="meta">${plugs}</div></div>
      <a class="btn go" href="${s.navUrl}" target="_blank" rel="noopener">Git ➜</a></div>`;
  }).join('');
}

async function run(lat, lng) {
  last = { lat, lng };
  $('status').textContent = `Aranıyor… (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
  const data = await getNearest(lat, lng);
  $('status').textContent = `Konum: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  render(data);
}

$('find').onclick = () => {
  if (!navigator.geolocation) { $('status').textContent = 'Konum desteklenmiyor, elle gir.'; $('manual').style.display = 'flex'; return; }
  $('status').textContent = 'Konum alınıyor…';
  navigator.geolocation.getCurrentPosition((p) => run(p.coords.latitude, p.coords.longitude),
    (e) => { $('status').textContent = 'Konum alınamadı (' + e.message + '). Elle gir.'; $('manual').style.display = 'flex'; },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
};
$('toggleManual').onclick = () => { $('manual').style.display = $('manual').style.display === 'flex' ? 'none' : 'flex'; };
$('fast').onclick = () => { minKw = minKw ? 0 : 50; $('fast').style.background = minKw ? '#16a34a' : ''; if (last) run(last.lat, last.lng); };
$('go').onclick = async () => {
  const q = $('q').value.trim(); const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) return run(+m[1], +m[2]);
  $('status').textContent = 'Adres aranıyor…';
  try {
    const r = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=' + encodeURIComponent(q))).json();
    if (!r[0]) return ($('status').textContent = 'Adres bulunamadı.');
    run(+r[0].lat, +r[0].lon);
  } catch { $('status').textContent = 'Adres araması başarısız.'; }
};
const qs = new URLSearchParams(location.search); // ?lat=..&lng=.. for testing / deep links
if (qs.get('lat')) run(+qs.get('lat'), +qs.get('lng'));
</script>
</body>
</html>
